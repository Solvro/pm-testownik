name: Small task
description: Mały, szybki temat do ogarnięcia bez rozkminy na 3 spotkania.
title: "[TASK] "
labels: ["task", "small"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Obszar
      description: |
        Wybierz główny obszar zadania.
        Wypełnia: osoba zgłaszająca.
      options:
        - Frontend
        - Backend
        - UI/UX
        - Docs/Content
        - Infra/DevOps
        - Other
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: Cel
      description: |
        1–2 zdania o celu tego taska.
        Wypełnia: PO, osoba zgłaszająca; TL Front/Back może doprecyzować technicznie.
      placeholder: |
        Np. Uporządkować onboarding w README, żeby nowa osoba odpaliła projekt w 10 minut.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Zakres
      description: |
        Co robimy i czego nie robimy. 2–6 punktów max.
        Wypełnia: osoba zgłaszająca + właściwy TL (Front albo Back) lub lider obszaru UI/UX.
      placeholder: |
        W zakresie:
        - ...
        Poza zakresem:
        - ...
    validations:
      required: false

  - type: textarea
    id: done
    attributes:
      label: Definicja done
      description: |
        Krótka checklista tego, co musi być dowiezione.
        Wypełnia: TL Front (FE) / TL Back (BE) / lider UI/UX.
        PO może dorzucić 1 kryterium funkcjonalne.
      placeholder: |
        - [ ] Zrobione
        - [ ] Podlinkowany PR / plik / Figma / materiał
        - [ ] Krótki opis co zmieniliśmy
    validations:
      required: true

  - type: input
    id: owner_hint
    attributes:
      label: Sugerowany owner (opcjonalnie)
      description: |
        Jeśli masz dobrego kandydata od razu.
        Wypełnia: osoba zgłaszająca.
      placeholder: "@nick"
    validations:
      required: false

  - type: input
    id: support
    attributes:
      label: Wsparcie / konsultacje (opcjonalnie)
      description: |
        Zwykle zostaw puste.
        Uzupełnij tylko jeśli potrzebujemy konkretnej osoby spoza standardu TL/PO.
      placeholder: "Np. @osoba-od-promocji"
    validations:
      required: false
